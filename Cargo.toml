[package]
name = "trackinsight-proxy"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "A headless-Chromium reverse proxy that solves the AWS WAF challenge guarding TrackInsight's public data API"
license = "MIT"
repository = "https://github.com/SeineEloquenz/trackinsight-proxy"

[dependencies]
anyhow = "1"
axum = "0.8"
chaser-oxide = "0.2.3"
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
strip = true
lto = "thin"
